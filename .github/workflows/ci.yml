name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate — must pass to merge.
  # Whole-workspace typecheck (libs + all apps + scripts) is green as of the
  # 2026-06 burndown, plus the per-package builds that Railway/Vercel run.
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + apps + scripts)
        run: pnpm typecheck

      - name: Build deploy targets
        # mockup-sandbox is a throwaway prototyping app (not deployed) whose
        # vite.config.ts requires PORT/BASE_PATH at load time — excluded here.
        run: >-
          pnpm -r
          --filter "./artifacts/**"
          --filter "!@workspace/mockup-sandbox"
          --if-present run build

  # Auto-deploy property-admin to Vercel on merge to main.
  #
  # api-server (→ Railway) and million-stay-web (→ Vercel) auto-deploy via their
  # own platform Git integrations. property-admin is a *pre-built* Vercel project
  # (vercel.json buildCommand is a no-op echo — see artifacts/property-admin/
  # vercel.json), so there's nothing for Vercel's Git integration to build. This
  # job reproduces the documented manual deploy (pnpm build → vercel deploy) and
  # only runs after `verify` passes, so a red build never ships.
  #
  # Requires one repo secret: VERCEL_TOKEN (a Vercel access token). The org/
  # project IDs below are non-secret identifiers (mirror of the gitignored
  # artifacts/property-admin/.vercel/project.json).
  deploy-admin:
    name: Deploy property-admin
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_VD0mxpPcMmO0IXw9XPlwhzyw
      VERCEL_PROJECT_ID: prj_yWV9Drabnu190eUDbXyleRIhbcQp
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors the documented manual deploy: build locally, then hand the
      # pre-built dist/public to Vercel (whose remote buildCommand is a no-op).
      - name: Build property-admin
        run: pnpm --filter @workspace/property-admin build

      - name: Deploy to Vercel (production)
        working-directory: artifacts/property-admin
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  # Auto-deploy the MetHeim white-label front-ends from main so the live tenant
  # always matches main. Removes humans from the loop: metheim-* Vercel projects
  # are NOT git-connected — every deploy is a local prebuilt upload, so manual /
  # stale-tree redeploys clobbered each other ("last writer wins"). Running the
  # shared redeploy script here (brand + env baked in) makes main the single
  # source of truth. NOTE: metheim projects live under the `sunjae2020s-projects`
  # Vercel scope, distinct from deploy-admin's team — needs a token with access
  # to that scope (VERCEL_TOKEN_METHEIM secret; falls back to VERCEL_TOKEN).
  deploy-metheim:
    name: Deploy MetHeim frontends
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_METHEIM || secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: sunjae2020s-projects
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds each app with the tenant brand/env, stages a prebuilt dir with
      # the /api proxy vercel.json, and deploys to the metheim-<app> projects.
      # The script honors VERCEL_TOKEN / VERCEL_SCOPE for non-interactive auth.
      - name: Deploy metheim admin + web
        run: TENANT=metheim scripts/redeploy-tenant-frontends.sh admin web
