kind = "web"
previewPath = "/million-stay-web/"
title = "MillionStay Web"
version = "1.0.0"
id = "artifacts/million-stay-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/million-stay-web/" ]
localPort = 20546

[services.development]
run = "pnpm --filter @workspace/million-stay-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/million-stay-web", "run", "build" ]
publicDir = "artifacts/million-stay-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20546"
BASE_PATH = "/million-stay-web/"
