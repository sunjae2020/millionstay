<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser page translation (Chrome auto-translate) swaps out the text nodes React is
         tracking and crashes the app with "Failed to execute 'removeChild' on 'Node'".
         The app ships its own language switcher, so opt out of it. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Million Stay</title>
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Baseline description and share card. Per-page values are set at runtime
         from the CMS (usePageSeo); these are what a scraper that does NOT run
         JavaScript sees — messaging apps mostly read the raw HTML only. Keep
         them generic: they describe the site, not any one page. -->
    <meta name="description" content="Find a place to stay and manage it in one place — search, book, lease and settle." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Million Stay" />
    <meta property="og:description" content="Find a place to stay and manage it in one place — search, book, lease and settle." />
    <meta property="og:image" content="/logo-mark.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Dynalight&display=swap" rel="stylesheet">
    <!-- Pretendard (KO/CJK body, Brand Guideline v2.0) — dynamic-subset CSS, unicode-range based so only used glyphs load. -->
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
