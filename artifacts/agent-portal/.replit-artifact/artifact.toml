kind = "web"
previewPath = "/agent-portal/"
title = "MillionStay Agent Portal"
version = "1.0.0"
id = "artifacts/agent-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/agent-portal/" ]
localPort = 24393

[services.development]
run = "pnpm --filter @workspace/agent-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-portal", "run", "build" ]
publicDir = "artifacts/agent-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24393"
BASE_PATH = "/agent-portal/"
