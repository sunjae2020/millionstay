kind = "web"
previewPath = "/service-host-portal/"
title = "MillionStay Service Host Portal"
version = "1.0.0"
id = "artifacts/service-host-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/service-host-portal/" ]
localPort = 21888

[services.development]
run = "pnpm --filter @workspace/service-host-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/service-host-portal", "run", "build" ]
publicDir = "artifacts/service-host-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21888"
BASE_PATH = "/service-host-portal/"
