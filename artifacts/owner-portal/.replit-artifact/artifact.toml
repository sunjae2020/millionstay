kind = "web"
previewPath = "/owner-portal/"
title = "MillionStay Owner Portal"
version = "1.0.0"
id = "artifacts/owner-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/owner-portal/" ]
localPort = 19049

[services.development]
run = "pnpm --filter @workspace/owner-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/owner-portal", "run", "build" ]
publicDir = "artifacts/owner-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19049"
BASE_PATH = "/owner-portal/"
