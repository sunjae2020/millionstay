kind = "web"
previewPath = "/admin"
title = "MillionStay Admin"
version = "1.0.0"
id = "artifacts/property-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin" ]
localPort = 23339

[services.development]
run = "pnpm --filter @workspace/property-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/property-admin", "run", "build" ]
publicDir = "artifacts/property-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/admin/*"
to = "/index.html"

[services.env]
PORT = "23339"
BASE_PATH = "/"
