openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: suburbs
    description: Suburb management
  - name: properties
    description: Property management
  - name: space-options
    description: Space option management
  - name: space-policies
    description: Space policy management
  - name: spaces
    description: Space management
  - name: commissions
    description: Commission management
  - name: payment-info
    description: Payment info management
  - name: contacts
    description: Contact management
  - name: accounts
    description: Account management
  - name: beneficiaries
    description: Beneficiary management
  - name: lookup
    description: Lookup endpoints for LookupField dialogs
  - name: tasks
    description: Task management
  - name: leads
    description: Lead management
  - name: service-hosts
    description: Service host management
  - name: bookings
    description: Booking management
  - name: promotions
    description: Promotion management
  - name: work-orders
    description: Work order management
  - name: invoices
    description: Invoice management
  - name: contracts
    description: Contract management
  - name: contract-products
    description: Contract product management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─────────────────────────────────────────────
  # SUBURBS
  # ─────────────────────────────────────────────
  /v1/suburbs:
    get:
      operationId: listSuburbs
      tags: [suburbs]
      summary: List suburbs
      parameters:
        - name: country_code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of suburbs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suburb"
    post:
      operationId: createSuburb
      tags: [suburbs]
      summary: Create suburb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuburbBody"
      responses:
        "201":
          description: Created suburb
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suburb"

