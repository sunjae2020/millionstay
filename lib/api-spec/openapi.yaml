          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of suburbs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suburb"
    post:
      operationId: createSuburb
      tags: [suburbs]
      summary: Create suburb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuburbBody"
      responses:
        "201":
          description: Created suburb
          content:
            application/json:
              schema:
