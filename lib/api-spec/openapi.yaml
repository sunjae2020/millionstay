          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suburb
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suburb"
        "404":
          description: Not found
    put:
      operationId: updateSuburb
