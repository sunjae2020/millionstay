# Railway / nixpacks build config for the api-server service.
#
# Why this exists: the API renders PDFs (homestay e-sign docs, invoices, quotes,
# contracts) with Puppeteer. Puppeteer's *bundled* Chromium needs system shared
# libraries that the default nixpacks image does not provide, so `puppeteer.launch()`
# fails on Railway with PdfUnavailableError → the /pdf and /send endpoints return
# 503 { "error": "pdf_unavailable" }. Installing the nix `chromium` package brings a
# working browser (with its runtime deps) onto PATH; src/lib/documents/pdf.ts then
# auto-detects it via resolveSystemChromium().
#
# NOTE: nixpacks reads this file from the Railway service's *root directory*. This
# repo is a pnpm workspace whose install runs at the repo root, so the file lives
# here. If the api-server service's Root Directory is set to artifacts/api-server,
# move this file there instead.

[phases.setup]
# "..." keeps nixpacks' auto-detected packages (node, pnpm) and appends chromium.
nixPkgs = ["...", "chromium"]

[variables]
# Node 24 — the version CI builds and typechecks with (.github/workflows/ci.yml).
# MUST be pinned: nothing else in the repo declares a Node version, so nixpacks
# fell back to its default (18) and the API crash-looped on boot the moment
# @simplewebauthn/server@14 arrived — it reads `globalThis.crypto.subtle` at
# module load, and the global `crypto` only exists from Node 19 on:
#   TypeError: Cannot read properties of undefined (reading 'supports')
# CI never caught it because it runs tsc + esbuild, never boots the server.
NIXPACKS_NODE_VERSION = "24"

# We use the system (nix) Chromium found on PATH, so skip puppeteer's ~150MB
# Chromium download at install time.
PUPPETEER_SKIP_DOWNLOAD = "true"
